name = "iraq-businesses-dashboard"
main = "server/index.js"
compatibility_date = "2024-01-01"

[vars]
NODE_ENV = "production"

[[kv_namespaces]]
binding = "BUSINESS_DATA"
id = "your-kv-namespace-id"

[build]
command = "cd client && npm install && npm run build"
cwd = "."
watch_dir = "client/src"

[site]
bucket = "./client/dist"
